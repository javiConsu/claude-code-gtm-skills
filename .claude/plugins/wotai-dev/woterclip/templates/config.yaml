version: 1

# Auto-generated by /woterclip-init — customize for your repo

linear:
  user: "{{USER_NAME}}"
  team: "{{TEAM}}"
  project: null                  # Optional: scope to a specific project

heartbeat:
  max_issues_per_cycle: 2        # Max issues to process per heartbeat run
  stale_lock_hours: 4            # Hours before treating a lockfile as stale
  quiet_hours:
    enabled: false
    start: "22:00"               # Local time
    end: "08:00"
    triage_only: false           # If true, run Orchestrator-only during quiet hours
  error_cooldown:
    enabled: true
    max_consecutive_failures: 3  # Pause after this many consecutive failures
    cooldown_minutes: 30

labels:
  group: "WoterClip"             # Parent label group name
  working: "agent-working"       # Label applied while agent is active
  blocked: "agent-blocked"       # Label applied when agent is blocked

personas:
  orchestrator:
    name: Orchestrator
    path: personas/orchestrator
    label: null                  # null = default (matches unlabeled issues)
    is_default: true
  ceo:
    name: CEO
    path: personas/ceo
    label: ceo
  backend:
    name: Backend Engineer
    path: personas/backend
    label: backend
  frontend:
    name: Frontend Engineer
    path: personas/frontend
    label: frontend
